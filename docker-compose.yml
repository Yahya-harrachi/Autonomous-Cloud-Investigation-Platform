version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acip-postgres
    environment:
      POSTGRES_USER: acip
      POSTGRES_PASSWORD: acip_dev_password
      POSTGRES_DB: acip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acip"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:1.4.0
    container_name: acip-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,events,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - EDGE_PORT=4566
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  localstack_data:
