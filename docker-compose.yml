version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acip-postgres
    environment:
      POSTGRES_USER: acip
      POSTGRES_PASSWORD: acip_dev_password
      POSTGRES_DB: acip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acip"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acip-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://acip:acip_dev_password@postgres:5432/acip
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acip-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_DOCKER=true
      - CHOKIDAR_USERPOLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
  