version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acip-postgres
    environment:
      POSTGRES_USER: acip
      POSTGRES_PASSWORD: acip_dev_password
      POSTGRES_DB: acip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acip"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:1.4.0
    container_name: acip-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,events,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - EDGE_PORT=4566
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acip-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://acip:acip_dev_password@postgres:5432/acip
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acip-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_DOCKER=true
    depends_on:
      - backend

volumes:
  postgres_data:
  localstack_data: